<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>私密文件</title><link rel="stylesheet" href="./style.css"><script src="./unlock.js" defer></script></head>
<body><main><span class="eyebrow">PRIVATE FILE</span><h1>私密文件</h1><p class="intro">输入分享密码，解锁并下载文件。</p><form id="unlock"><label for="password">分享密码</label><input id="password" name="password" type="password" required maxlength="256" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入密码"><button id="submit" type="submit">解锁文件</button></form><p id="status" role="status" aria-live="polite"></p><section id="result" hidden><p id="filename"></p><a id="download" class="button">下载 PDF</a><button id="lock" class="secondary" type="button">重新锁定</button></section><p class="hint">请妥善保管密码。若无法下载，请使用系统浏览器打开。</p></main></body></html>
